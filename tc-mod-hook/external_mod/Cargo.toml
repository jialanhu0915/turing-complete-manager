[package]
name = "external_mod"
version = "0.1.0"
edition = "2021"
description = "Example external mod for tc-mod-hook. Loaded into the game process via LoadLibraryW + GetProcAddress(register_mods). Demonstrates the CORRECT pattern for mod authors: NO static dep on tc-mod-hook DLL (which would cause Windows to load a duplicate). Instead, the mod defines its own local CompileCtx layout (#[repr(C)]) and uses raw FFI."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# NO [dependencies] on tc-mod-hook. Mod authors should NOT statically link
# to the host SDK DLL. Doing so causes Windows to load a duplicate
# (via the deps/ copy), which means the mod and the host have separate
# static state — mod registrations don't work.
#
# Instead, we declare the foreign function and types we need via raw FFI
# declarations below. Layout is fixed by #[repr(C)] in tc-mod-hook.

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
]