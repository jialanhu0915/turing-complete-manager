<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turing Complete Manager</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main id="app">
      <section id="wizard" hidden>
        <header>
          <h1>Turing Complete Manager</h1>
          <p class="step-indicator">
            第 <span id="wizard-step">1</span> / 3 步
          </p>
        </header>

        <div class="step" id="step-1">
          <h2>选择存档目录</h2>
          <p class="hint" id="save-dir-hint">检测中…</p>
          <div class="path-row">
            <input type="text" id="save-dir-input" spellcheck="false" />
            <button type="button" id="save-dir-pick">浏览…</button>
          </div>
        </div>

        <div class="step" id="step-2" hidden>
          <h2>选择备份目录</h2>
          <p class="hint">默认与软件安装目录相同（其下的 <code>backups</code> 子目录）。</p>
          <div class="path-row">
            <input type="text" id="backup-dir-input" spellcheck="false" />
            <button type="button" id="backup-dir-pick">浏览…</button>
          </div>
        </div>

        <div class="step" id="step-3" hidden>
          <h2>选择界面语言</h2>
          <div class="lang-row">
            <label><input type="radio" name="lang" value="zh-CN" checked /> 简体中文</label>
            <label><input type="radio" name="lang" value="en-US" /> English</label>
          </div>
        </div>

        <footer class="nav">
          <button type="button" id="wizard-prev" hidden>上一步</button>
          <span class="spacer"></span>
          <button type="button" id="wizard-next">下一步</button>
          <button type="button" id="wizard-finish" hidden>完成</button>
        </footer>
      </section>

      <section id="main" hidden>
        <header>
          <h1>Turing Complete Manager</h1>
          <p class="version">v<span id="app-version">…</span></p>
        </header>

        <details class="config-section">
          <summary>配置信息</summary>
          <dl class="config-summary">
            <dt>存档目录</dt><dd id="current-save-dir">…</dd>
            <dt>备份目录</dt><dd id="current-backup-dir">…</dd>
            <dt>界面语言</dt><dd id="current-language">…</dd>
          </dl>
          <button type="button" id="reset-config">重置配置</button>
        </details>

        <section class="backup-section">
          <div class="backup-header">
            <h2>备份管理</h2>
            <span class="game-status" id="game-status">检查中…</span>
          </div>
          <div class="action-row">
            <button type="button" id="create-backup" class="primary">立即备份</button>
            <button type="button" id="refresh-list">刷新列表</button>
          </div>
          <table class="backup-list">
            <thead>
              <tr>
                <th>备份时间</th>
                <th>大小</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="backup-rows">
              <tr><td colspan="3" class="empty">加载中…</td></tr>
            </tbody>
          </table>
        </section>

        <details class="config-section">
          <summary>关卡编辑器（levels.txt）</summary>
          <p class="hint">
            切换每关的通关标志。仅修改第二列，其他字段原样保留。
            修改前会自动备份原文件到存档目录下的 <code>levels_backups/</code>。
          </p>
          <div class="action-row">
            <button type="button" id="levels-reload">重新读取</button>
            <input type="text" id="levels-search" placeholder="过滤关卡 ID…" />
            <span class="spacer"></span>
            <span id="levels-pending" class="hint inline">无修改</span>
            <button type="button" id="levels-discard" disabled>放弃修改</button>
            <button type="button" id="levels-save" class="primary" disabled>保存修改</button>
          </div>
          <table class="backup-list">
            <thead>
              <tr>
                <th style="width:60px">通关</th>
                <th>关卡 ID</th>
                <th>方案</th>
                <th style="width:90px">记录数</th>
              </tr>
            </thead>
            <tbody id="levels-rows">
              <tr><td colspan="4" class="empty">点击「重新读取」加载。</td></tr>
            </tbody>
          </table>
        </details>
      </section>
    </main>
  </body>
</html>
